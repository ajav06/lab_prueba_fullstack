services:
  frontend:
    image: frontend:local
    build:
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8181
    ports:
      - '80:8080'
  backend:
    image: backend:local
    build:
      dockerfile: Dockerfile.backend
    ports:
      - '8181:8181'
    environment:
      DATABASE_URL: postgresql://ash:dbpassword@db/pokedex
    depends_on:
      - db
  db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: ash
      POSTGRES_PASSWORD: dbpassword
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./resources/database_backup.sql:/docker-entrypoint-initdb.d/database_backup.sql

volumes:
  postgres_data: